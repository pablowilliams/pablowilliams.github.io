name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout GraphShield
        uses: actions/checkout@v4
        with:
          repository: pablowilliams/graphshield
          path: _published/graphshield
      - name: Checkout SignalOps
        uses: actions/checkout@v4
        with:
          repository: pablowilliams/signalops
          path: _published/signalops
      - name: Checkout Payment Risk Workbench
        uses: actions/checkout@v4
        with:
          repository: pablowilliams/payment-risk-workbench
          path: _published/payment-risk-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build portfolio
        run: npm run build
      - name: Build static product editions
        run: |
          npm ci --prefix _published/graphshield
          npm run build:pages --prefix _published/graphshield
          npm ci --prefix _published/signalops
          npm run build:pages --prefix _published/signalops
          npm ci --prefix _published/payment-risk-workbench
          npm run build:pages --prefix _published/payment-risk-workbench
          mkdir -p dist/graphshield dist/signalops dist/payment-risk-workbench
          cp -R _published/graphshield/dist-pages/. dist/graphshield/
          cp -R _published/signalops/dist-pages/. dist/signalops/
          cp -R _published/payment-risk-workbench/dist-pages/. dist/payment-risk-workbench/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
