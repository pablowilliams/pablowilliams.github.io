name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: pip install -r requirements-report.txt
      - run: npm run report
      - name: Confirm generated evidence is current
        run: git diff --exit-code -- reports/results.json reports/figures/portfolio-inventory.svg reports/pablowilliams-github-io-one-page-report.pdf
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
